<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" shape-rendering="crispEdges">
  <style>
    /* Hand wave - the only animation */
    @keyframes hand-wave {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-30deg); }
      40% { transform: rotate(20deg); }
      60% { transform: rotate(-15deg); }
      80% { transform: rotate(10deg); }
    }

    /* Speech bubble pop */
    @keyframes bubble-pop {
      0% { transform: scale(0); opacity: 0; }
      15% { transform: scale(1.2); opacity: 1; }
      25%, 85% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.7); opacity: 0; }
    }

    /* Eye blink (subtle) */
    @keyframes eye-blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }

    .waving-hand {
      animation: hand-wave 1.2s steps(5) infinite;
      transform-origin: 38px 60px;
    }

    .speech-bubble {
      animation: bubble-pop 3.5s steps(4) infinite;
      transform-origin: center;
    }

    .eye {
      animation: eye-blink 3.5s steps(2) infinite;
      transform-origin: center;
    }
  </style>

  <!-- Speech bubble saying "Hi!" -->
  <g class="speech-bubble">
    <rect x="58" y="14" width="50" height="26" fill="#0f0f1e"/>
    <rect x="62" y="18" width="42" height="18" fill="#fefefe"/>
    <!-- "Hi!" text rendered as pixels -->
    <rect x="68" y="22" width="3" height="10" fill="#0f0f1e"/>
    <rect x="71" y="22" width="3" height="10" fill="#0f0f1e"/>
    <rect x="76" y="22" width="3" height="3" fill="#0f0f1e"/>
    <rect x="68" y="29" width="11" height="3" fill="#0f0f1e"/>
    <rect x="84" y="22" width="3" height="10" fill="#0f0f1e"/>
    <rect x="84" y="22" width="6" height="3" fill="#0f0f1e"/>
    <rect x="90" y="22" width="3" height="10" fill="#0f0f1e"/>
    <rect x="84" y="29" width="6" height="3" fill="#0f0f1e"/>
    <!-- Tail pointing to character -->
    <rect x="56" y="38" width="4" height="4" fill="#0f0f1e"/>
    <rect x="52" y="40" width="4" height="4" fill="#0f0f1e"/>
  </g>

  <!-- Character body (no bob) -->
  <!-- Feet -->
  <rect x="42" y="98" width="12" height="8" fill="#0f0f1e"/>
  <rect x="62" y="98" width="12" height="8" fill="#0f0f1e"/>
  <rect x="42" y="98" width="12" height="2" fill="#4361ee"/>
  <rect x="62" y="98" width="12" height="2" fill="#4361ee"/>

  <!-- Body / shirt -->
  <rect x="34" y="56" width="48" height="42" fill="#0f0f1e"/>
  <rect x="38" y="60" width="40" height="34" fill="#06d6a0"/>
  <rect x="38" y="60" width="40" height="4" fill="#0f4c3a"/>
  <rect x="38" y="90" width="40" height="4" fill="#0f4c3a"/>
  <!-- Shirt detail -->
  <rect x="54" y="72" width="8" height="18" fill="#0f0f1e"/>
  <rect x="50" y="80" width="16" height="3" fill="#0f0f1e"/>

  <!-- Right arm (down, static) -->
  <rect x="78" y="60" width="8" height="26" fill="#0f0f1e"/>
  <rect x="82" y="64" width="4" height="18" fill="#06d6a0"/>
  <rect x="78" y="82" width="8" height="6" fill="#0f0f1e"/>
  <rect x="80" y="86" width="4" height="3" fill="#ffb088"/>

  <!-- LEFT ARM (waving - ANIMATED) -->
  <g class="waving-hand">
    <rect x="26" y="40" width="8" height="24" fill="#0f0f1e"/>
    <rect x="30" y="44" width="4" height="16" fill="#06d6a0"/>
    <!-- Hand -->
    <rect x="22" y="32" width="16" height="12" fill="#0f0f1e"/>
    <rect x="26" y="36" width="8" height="8" fill="#ffb088"/>
    <!-- Fingers -->
    <rect x="26" y="30" width="3" height="6" fill="#ffb088"/>
    <rect x="30" y="28" width="3" height="8" fill="#ffb088"/>
    <rect x="34" y="30" width="3" height="6" fill="#ffb088"/>
  </g>

  <!-- Head -->
  <rect x="38" y="20" width="40" height="40" fill="#0f0f1e"/>
  <rect x="42" y="24" width="32" height="32" fill="#ffb088"/>

  <!-- Hair -->
  <rect x="38" y="16" width="40" height="8" fill="#0f0f1e"/>
  <rect x="42" y="12" width="32" height="4" fill="#0f0f1e"/>
  <rect x="46" y="20" width="4" height="4" fill="#0f0f1e"/>
  <rect x="66" y="20" width="4" height="4" fill="#0f0f1e"/>

  <!-- Eyes (with blink) -->
  <g class="eye">
    <rect x="48" y="32" width="6" height="6" fill="#0f0f1e"/>
    <rect x="64" y="32" width="6" height="6" fill="#0f0f1e"/>
    <rect x="50" y="34" width="2" height="2" fill="#fefefe"/>
    <rect x="66" y="34" width="2" height="2" fill="#fefefe"/>
  </g>

  <!-- Smile -->
  <rect x="54" y="46" width="10" height="3" fill="#0f0f1e"/>
  <rect x="52" y="46" width="2" height="2" fill="#0f0f1e"/>
  <rect x="64" y="46" width="2" height="2" fill="#0f0f1e"/>

  <!-- Cheeks -->
  <rect x="44" y="44" width="3" height="3" fill="#f72585" opacity="0.6"/>
  <rect x="71" y="44" width="3" height="3" fill="#f72585" opacity="0.6"/>
</svg>