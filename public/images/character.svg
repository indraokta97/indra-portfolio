<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <style>
    .pixel {
      image-rendering: pixelated;
    }

    /* Character idle bob */
    @keyframes char-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* Hand wave */
    @keyframes hand-wave {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-25deg); }
      40% { transform: rotate(15deg); }
      60% { transform: rotate(-15deg); }
      80% { transform: rotate(10deg); }
    }

    /* Body slight wiggle */
    @keyframes body-wiggle {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-0.5px); }
      75% { transform: translateX(0.5px); }
    }

    /* Eye blink */
    @keyframes eye-blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }

    /* Mouth talk */
    @keyframes mouth-talk {
      0%, 30%, 100% { transform: scaleY(1); }
      15% { transform: scaleY(0.5); }
      45% { transform: scaleY(1.4); }
      75% { transform: scaleY(0.6); }
    }

    /* Speech bubble pop */
    @keyframes bubble-pop {
      0% { transform: scale(0); opacity: 0; }
      20% { transform: scale(1.1); opacity: 1; }
      30%, 80% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.8); opacity: 0; }
    }

    /* Heart float */
    @keyframes heart-float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-30px); opacity: 0; }
    }

    /* Star twinkle */
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    .char-body {
      animation: char-bob 1.5s steps(4) infinite;
      transform-origin: 100px 200px;
    }

    .char-body-inner {
      animation: body-wiggle 0.8s steps(2) infinite;
      transform-origin: 100px 150px;
    }

    .char-hand {
      animation: hand-wave 1.5s steps(5) infinite;
      transform-origin: 70px 130px;
    }

    .eye {
      animation: eye-blink 3s steps(2) infinite;
      transform-origin: center;
    }

    .mouth {
      animation: mouth-talk 2s steps(4) infinite;
      transform-origin: center;
    }

    .speech-bubble {
      animation: bubble-pop 3s steps(4) infinite;
      transform-origin: center;
    }

    .heart-anim {
      animation: heart-float 1.5s steps(3) infinite;
    }

    .star-twinkle {
      animation: twinkle 1.2s steps(3) infinite;
    }
  </style>

  <!-- Background sparkles -->
  <g class="star-twinkle" style="animation-delay: 0s">
    <rect x="20" y="20" width="4" height="4" fill="#ffd60a"/>
    <rect x="24" y="16" width="4" height="4" fill="#ffd60a"/>
    <rect x="20" y="24" width="4" height="4" fill="#ffd60a"/>
    <rect x="16" y="20" width="4" height="4" fill="#ffd60a"/>
  </g>
  <g class="star-twinkle" style="animation-delay: 0.4s">
    <rect x="170" y="30" width="4" height="4" fill="#06d6a0"/>
    <rect x="174" y="26" width="4" height="4" fill="#06d6a0"/>
    <rect x="170" y="34" width="4" height="4" fill="#06d6a0"/>
    <rect x="166" y="30" width="4" height="4" fill="#06d6a0"/>
  </g>
  <g class="star-twinkle" style="animation-delay: 0.8s">
    <rect x="30" y="160" width="4" height="4" fill="#f72585"/>
    <rect x="34" y="156" width="4" height="4" fill="#f72585"/>
    <rect x="30" y="164" width="4" height="4" fill="#f72585"/>
    <rect x="26" y="160" width="4" height="4" fill="#f72585"/>
  </g>

  <!-- Speech bubble -->
  <g class="speech-bubble">
    <!-- Bubble border -->
    <rect x="130" y="50" width="56" height="32" fill="#0f0f1e"/>
    <rect x="134" y="54" width="48" height="24" fill="#fefefe"/>
    <!-- Hi! text -->
    <rect x="142" y="62" width="3" height="8" fill="#0f0f1e"/>
    <rect x="145" y="62" width="3" height="8" fill="#0f0f1e"/>
    <rect x="150" y="62" width="3" height="2" fill="#0f0f1e"/>
    <rect x="142" y="70" width="11" height="2" fill="#0f0f1e"/>
    <rect x="156" y="64" width="3" height="6" fill="#0f0f1e"/>
    <rect x="156" y="64" width="6" height="3" fill="#0f0f1e"/>
    <rect x="162" y="64" width="3" height="6" fill="#0f0f1e"/>
    <rect x="156" y="70" width="6" height="2" fill="#0f0f1e"/>
    <!-- Tail pointing down-left -->
    <rect x="128" y="80" width="4" height="4" fill="#0f0f1e"/>
    <rect x="124" y="84" width="4" height="4" fill="#0f0f1e"/>
  </g>

  <!-- Character body (with bob animation) -->
  <g class="char-body">
    <g class="char-body-inner">
      <!-- Feet -->
      <rect x="84" y="172" width="12" height="8" fill="#0f0f1e"/>
      <rect x="104" y="172" width="12" height="8" fill="#0f0f1e"/>
      <rect x="84" y="172" width="12" height="2" fill="#4361ee"/>
      <rect x="104" y="172" width="12" height="2" fill="#4361ee"/>

      <!-- Body -->
      <rect x="76" y="124" width="48" height="48" fill="#0f0f1e"/>
      <rect x="80" y="128" width="40" height="40" fill="#06d6a0"/>
      <rect x="80" y="128" width="40" height="4" fill="#0f4c3a"/>
      <rect x="80" y="164" width="40" height="4" fill="#0f4c3a"/>
      <!-- Shirt detail -->
      <rect x="96" y="140" width="8" height="20" fill="#0f0f1e"/>
      <rect x="92" y="148" width="16" height="4" fill="#0f0f1e"/>

      <!-- Right arm (down) -->
      <rect x="120" y="128" width="8" height="28" fill="#0f0f1e"/>
      <rect x="124" y="132" width="4" height="20" fill="#06d6a0"/>
      <rect x="120" y="152" width="8" height="8" fill="#0f0f1e"/>

      <!-- Left arm (waving - animated) -->
      <g class="char-hand">
        <rect x="68" y="100" width="8" height="28" fill="#0f0f1e"/>
        <rect x="72" y="104" width="4" height="20" fill="#06d6a0"/>
        <!-- Hand -->
        <rect x="64" y="92" width="16" height="12" fill="#0f0f1e"/>
        <rect x="68" y="96" width="8" height="8" fill="#ffb088"/>
        <!-- Fingers -->
        <rect x="68" y="92" width="3" height="4" fill="#ffb088"/>
        <rect x="72" y="90" width="3" height="6" fill="#ffb088"/>
        <rect x="76" y="92" width="3" height="4" fill="#ffb088"/>
      </g>

      <!-- Head -->
      <rect x="80" y="84" width="40" height="40" fill="#0f0f1e"/>
      <rect x="84" y="88" width="32" height="32" fill="#ffb088"/>
      <!-- Hair -->
      <rect x="80" y="80" width="40" height="8" fill="#0f0f1e"/>
      <rect x="84" y="76" width="32" height="4" fill="#0f0f1e"/>
      <rect x="88" y="84" width="4" height="4" fill="#0f0f1e"/>
      <rect x="108" y="84" width="4" height="4" fill="#0f0f1e"/>
      <!-- Eyes (with blink) -->
      <g class="eye">
        <rect x="90" y="96" width="6" height="6" fill="#0f0f1e"/>
        <rect x="106" y="96" width="6" height="6" fill="#0f0f1e"/>
        <rect x="92" y="98" width="2" height="2" fill="#fefefe"/>
        <rect x="108" y="98" width="2" height="2" fill="#fefefe"/>
      </g>
      <!-- Mouth (talking) -->
      <g class="mouth">
        <rect x="96" y="110" width="10" height="4" fill="#0f0f1e"/>
      </g>
      <!-- Cheeks -->
      <rect x="86" y="108" width="3" height="3" fill="#f72585" opacity="0.6"/>
      <rect x="113" y="108" width="3" height="3" fill="#f72585" opacity="0.6"/>
    </g>
  </g>

  <!-- Floating heart -->
  <g class="heart-anim">
    <rect x="160" y="80" width="4" height="4" fill="#e63946"/>
    <rect x="164" y="76" width="4" height="4" fill="#e63946"/>
    <rect x="170" y="80" width="4" height="4" fill="#e63946"/>
    <rect x="158" y="84" width="20" height="4" fill="#e63946"/>
    <rect x="160" y="88" width="16" height="4" fill="#e63946"/>
    <rect x="162" y="92" width="12" height="4" fill="#e63946"/>
    <rect x="164" y="96" width="8" height="4" fill="#e63946"/>
    <rect x="166" y="100" width="4" height="4" fill="#e63946"/>
  </g>
</svg>